<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#16130e" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="icon" href="/favicon-48.png" sizes="48x48" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Route-aware LCP preload for the hero image of the page being opened (home, /flavors, flavor pages,
      // /distributors, /our-story).
      // Names/widths mirror scripts/images.config.mjs.
      (function () {
        var p = location.pathname;
        var m = /^\/flavors\/(lemon|peach)\/?$/.exec(p);
        var list = /^\/flavors\/?$/.test(p);
        var home = p === '/' || p === '';
        if (/^\/our-story\/?$/.test(p)) {
          // story hero: the duo photo (creators/both-03) is the LCP element
          var st = document.createElement('link');
          st.rel = 'preload';
          st.as = 'image';
          st.type = 'image/avif';
          st.setAttribute('fetchpriority', 'high');
          st.imageSrcset = [480, 768, 1080, 1440, 2048]
            .map(function (x) {
              return '/images/creators/both-03-' + x + '.avif ' + x + 'w';
            })
            .join(', ');
          st.imageSizes = '(max-aspect-ratio: 1/1) 100vw, 62vw';
          document.head.appendChild(st);
          return;
        }
        if (/^\/distributors\/?$/.test(p)) {
          // distributors hero: the lemon bottle cutout is the LCP element
          var d = document.createElement('link');
          d.rel = 'preload';
          d.as = 'image';
          d.type = 'image/avif';
          d.setAttribute('fetchpriority', 'high');
          d.imageSrcset = [160, 240, 360, 480, 640, 815]
            .map(function (x) {
              return '/images/bottle-lemon-' + x + '.avif ' + x + 'w';
            })
            .join(', ');
          d.imageSizes = '220px';
          document.head.appendChild(d);
          return;
        }
        var f = m ? m[1] : list || home ? 'lemon' : null;
        if (!f) return;
        var portrait = list || innerWidth / innerHeight <= 1;
        var n = 'hero-' + f + '-' + (portrait ? 'portrait' : 'wide');
        var w = portrait ? [480, 768, 1024, 1229] : [640, 1024, 1536, 2048, 2752];
        var l = document.createElement('link');
        l.rel = 'preload';
        l.as = 'image';
        l.type = 'image/avif';
        l.setAttribute('fetchpriority', 'high');
        l.imageSrcset = w
          .map(function (x) {
            return '/images/' + n + '-' + x + '.avif ' + x + 'w';
          })
          .join(', ');
        l.imageSizes = list ? '(min-width: 1024px) 34rem, 100vw' : '100vw';
        document.head.appendChild(l);
      })();
    </script>
    <!--page-meta-->
    <title>Hipz</title>
    <!--/page-meta-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

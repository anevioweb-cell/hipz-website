<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#16130e" />
    <meta name="description" content="Hipz — lemon and peach drinks." />
    <link rel="icon" href="/logo-badge.png" type="image/png" />
    <script>
      // Route-aware LCP preload (flavor pages only; the home hero image is requested right after the
      // headline's first paint on purpose). Names/widths mirror scripts/images.config.mjs.
      (function () {
        var p = location.pathname;
        var m = /^\/flavors\/(lemon|peach)\/?$/.exec(p);
        var list = /^\/flavors\/?$/.test(p);
        var f = m ? m[1] : list ? 'lemon' : null;
        if (!f) return;
        var portrait = list || innerWidth / innerHeight <= 1;
        var n = 'hero-' + f + '-' + (portrait ? 'portrait' : 'wide');
        var w = portrait ? [480, 768, 1024, 1229] : [640, 1024, 1536, 2048, 2752];
        var l = document.createElement('link');
        l.rel = 'preload';
        l.as = 'image';
        l.type = 'image/avif';
        l.setAttribute('fetchpriority', 'high');
        l.imageSrcset = w
          .map(function (x) {
            return '/images/' + n + '-' + x + '.avif ' + x + 'w';
          })
          .join(', ');
        l.imageSizes = list ? '(min-width: 1024px) 34rem, 100vw' : '100vw';
        document.head.appendChild(l);
      })();
    </script>
    <title>Hipz</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
